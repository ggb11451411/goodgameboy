<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑夜君临 - Good Game Boy</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            color: #ffcc66;
            margin-bottom: 10px;
        }

        a {
            text-decoration: none;
        }

        .back {
            color: #ffcc66;
        }

        .intro {
            background: #1b1b1b;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        /* 优化：修复了 Grid 不分列的问题，实现响应式多列排版 */
        .grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }

        .card {
            background: #1b1b1b;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #333;
            /* 优化：让卡片内部垂直排列，按钮自动沉底，保证卡片高度一致时美观 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card h3 {
            color: #ffcc66;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .card p {
            color: #bbb;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .button {
            display: inline-block;
            background: #ffcc66;
            color: black;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            transition: background 0.2s; /* 优化：让悬停动画更平滑 */
        }

        .button:hover {
            background: #ffd980;
        }
    </style>
</head>
<body>

    <h1>⚔️ 艾尔登法环：黑夜君临</h1>

    <p>
        <a class="back" href="/">← 返回首页</a>
    </p>

    <div class="intro">
        <h2>黑环资料库</h2>
        <p>收录角色图鉴、遗物系统、地图机制、深度模式、玩法机制与流派推荐。</p>
    </div>

    <div class="grid">

        <div class="card">
            <h3>🧙 角色图鉴</h3>
            <p>全部夜行者资料与技能介绍。</p>
            <a class="button" href="/elden-ring-nightreign/characters/">进入专区</a>
        </div>

        <div class="card">
            <h3>💎 遗物系统</h3>
            <p>遗物、深层遗物与毕业搭配。</p>
            <a class="button" href="/elden-ring-nightreign/relics/">进入专区</a>
        </div>

        <div class="card">
            <h3>🗺️ 地图系统</h3>
            <p>Limveld地图与路线规划。</p>
            <a class="button" href="/elden-ring-nightreign/maps/">进入专区</a>
        </div>

        <div class="card">
            <h3>🌑 深度模式</h3>
            <p>Depth评级、深夜模式与无限战斗。</p>
            <a class="button" href="/elden-ring-nightreign/depth/">进入专区</a>
        </div>

        <div class="card">
            <h3>⚔️ 玩法机制</h3>
            <p>三天循环、夜潮与基础机制。</p>
            <a class="button" href="/elden-ring-nightreign/mechanics/">进入专区</a>
        </div>

        <div class="card">
            <h3>🔥 流派推荐</h3>
            <p>角色Build与毕业搭配推荐。</p>
            <a class="button" href="/elden-ring-nightreign/builds/">进入专区</a>
        </div>

    </div>

</body>
</html>
